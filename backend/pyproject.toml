[project]
name = "saathi-backend"
version = "0.1.0"
description = "Saathi backend: agent brain, scam link checks, speech relay and welfare checks"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9",
  "websockets>=12",
  "google-genai>=1.0",
  "sarvamai>=0.1.40",
  "playwright>=1.45",
  "python-whois>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter wraps code; long user-facing strings stay on one line

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
