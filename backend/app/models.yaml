# Every model ID the backend uses lives in this file only. Verified 2026-10-31 against
# https://ai.google.dev/gemini-api/docs/models and https://docs.sarvam.ai (see BACKEND_NOTES.md).

intent_router:       { model: gemini-3.5-flash-lite,  temperature: 0.1, json: true, timeout_s: 4 }
agent_step:          { model: gemini-3.8-flash,       temperature: 0.2, json: true, vision: true, timeout_s: 8 }
agent_step_hard:     { model: gemini-3.1-pro-preview, temperature: 0.2, json: true, vision: true, timeout_s: 12 }
classify_messages:   { model: gemini-3.5-flash-lite,  temperature: 0.0, json: true, timeout_s: 8 }
extract_appointment: { model: gemini-3.5-flash-lite,  temperature: 0.0, json: true, timeout_s: 8 }
link_verdict:        { model: gemini-3.8-flash,       temperature: 0.0, json: true, vision: true, timeout_s: 15 }
digest_writer:       { model: gemini-3.5-flash-lite,  temperature: 0.4, timeout_s: 8 }
camera_live:         { model: gemini-3.8-live }       # Live API: 16 kHz PCM + JPEG in, 24 kHz PCM out
clinic_call:         { model: gemini-3.8-flash,       temperature: 0.3, json: true, timeout_s: 8 }   # stretch: simulated call turns
clinic_call_live:    { model: gemini-3.8-live }       # stretch: real telephony bridge (not built)

# Speech: Sarvam, turn-based only
stt:
  provider: sarvam
  model: "saaras:v4"
  # codemix keeps English words in Latin and Hindi words in Devanagari, which is what
  # language_style.py needs to tell hi from hinglish.
  mode: codemix
  keyterms: true
  timeout_s: 4
tts:
  provider: sarvam
  model: "bulbul:v4-flash"
  pace: 0.9
  sample_rate: 24000
  timeout_s: 3
  speakers:   { en: aparna_en_companion, hi: roopa_hi_companion, hinglish: simran_enhi_companion }
  languages:  { en: en-IN, hi: hi-IN, hinglish: hi-IN }
  # Set true if the Phase 1 script check finds Bulbul reads Hinglish better from Devanagari.
  transliterate_hinglish: false
transliterate: { provider: sarvam }
