# Every model ID the backend uses lives in this file only.
# 2026-11-01: every reasoning route (no voice, Sarvam or realtime) runs Gemma 4 31B on DigitalOcean serverless
# inference (app/llm/do_inference.py, DIGITALOCEAN_INFERENCE_KEY); its old Gemini model is the fallback. Measured
# 2.7-6 s per call, JSON mode and images both work. Qwen 3.8 Max (same endpoint, 1-2 s, images too) takes hard
# screens and the skill compiler, and gives the `second_opinion` when Gemma's answer is invalid. DigitalOcean has no
# Gemini model, so the `fallback` (outage or timeout) is Gemini 3.5 Flash Lite through Google directly. Verified 2026-10-31 against
# https://ai.google.dev/gemini-api/docs/models and https://docs.sarvam.ai (see BACKEND_NOTES.md).

# Measured with the live key on 2026-10-31: gemini-3.8-flash was overloaded (503s, one 166 s answer) and does not
# accept thinking_level "minimal"; gemini-3.5-flash / -lite with minimal thinking answer in ~2-3 s.
# `thinking` sets ThinkingConfig.thinking_level; `fallback` is tried once if the primary is overloaded or times out.
# Later the same day the same key took 10 s (flash-lite) and 17 s (flash) for "Say OK", with ~50 ms of network, so
# agent steps allow 20-25 s per model. The phone waits 55 s per step (BackendClient.agentHttp) to cover the fallback.
# intent_router stays short: the phone gives up after 4 s and answers with its own keyword rules.
intent_router:       { model: gemma-4-31B-it,       thinking: minimal, fallback: gemini-3.5-flash-lite, second_opinion: qwen3.8-max, temperature: 0.1, json: true, timeout_s: 5 }
# The spoken reply after a user's compiled ability did the bookkeeping (app/abilities): short, like intent_router.
ability_reply:       { model: gemma-4-31B-it,       thinking: minimal, fallback: gemini-3.5-flash-lite, temperature: 0.4, json: true, timeout_s: 5 }
# On a real Uber run flash took 16 s + 12 s (invalid JSON, retried) and then timed out at 20 s, while flash-lite answered
# in 1.4 s; agent steps tried flash-lite first. At 23:00 on 2026-10-31 flash-lite timed out on most calls while
# flash answered in 2-5 s, so intent_router and agent_step try flash first again. agent_step_hard keeps the stronger model for repeated failures.
agent_step:          { model: gemma-4-31B-it,       thinking: minimal, fallback: gemini-3.5-flash-lite, second_opinion: qwen3.8-max, temperature: 0.2, json: true, vision: true, timeout_s: 12, hedge_s: 5 }
agent_step_hard:     { model: qwen3.8-max,           thinking: minimal, fallback: gemini-3.5-flash-lite, temperature: 0.2, json: true, vision: true, timeout_s: 15 }
classify_messages:   { model: gemma-4-31B-it,  thinking: minimal, fallback: gemini-3.5-flash-lite, second_opinion: qwen3.8-max, temperature: 0.0, json: true, timeout_s: 8 }
extract_appointment: { model: gemma-4-31B-it,  thinking: minimal, fallback: gemini-3.5-flash-lite, second_opinion: qwen3.8-max, temperature: 0.0, json: true, timeout_s: 8 }
link_verdict:        { model: gemma-4-31B-it,       thinking: minimal, fallback: gemini-3.5-flash-lite, second_opinion: qwen3.8-max, temperature: 0.0, json: true, vision: true, timeout_s: 15 }
digest_writer:       { model: gemma-4-31B-it,  thinking: minimal, fallback: gemini-3.5-flash-lite, second_opinion: qwen3.8-max, temperature: 0.4, timeout_s: 8 }
# Skill compiler: runs rarely (only when a task has enough new runs), so it uses the strongest model.
skill_compiler:      { model: qwen3.8-max,             thinking: high, fallback: gemini-3.5-flash-lite, temperature: 0.1, timeout_s: 180 }
camera_live:         { model: gemini-3.8-live, voice: Sulafat }  # Live API: 16 kHz PCM + JPEG in, 24 kHz PCM out; same voice as voice_live
# The elder's spoken conversation (docs/features/LEARNING.md §2). Both IDs listed with bidiGenerateContent on the key, 2026-10-31.
# Gemini Live runs the conversation and speaks in its own voice (no extra delay). Aoede, an English voice, sounded
# poor in Hindi, so the warmer Sulafat is used. The language is not pinned: the prompt makes Saathi answer in
# whatever the user just spoke (English, Hindi or Hinglish). speak_with: sarvam re-speaks replies in the tts voice
# below instead (the hospital-call voice), at about 1-2 s extra per reply.
voice_live:          { model: gemini-3.8-live, fallback: gemini-3.1-flash-live-preview, voice: Sulafat, speak_with: gemini }
clinic_call:         { model: gemma-4-31B-it,  thinking: minimal, fallback: gemini-3.5-flash-lite, second_opinion: qwen3.8-max, temperature: 0.3, json: true, timeout_s: 8 }   # stretch: simulated call turns
clinic_call_live:    { model: gemini-3.8-live }       # stretch: real telephony bridge (not built)
# Symptom-to-care (docs/features/CARE.md). Every route has a rule-based fallback, so a slow model never blocks the user.
# On the phone flash timed out at 20 s on the first intake turn; flash-lite then answered in 4.4 s.
care_triage:         { model: gemma-4-31B-it,  thinking: minimal, fallback: gemini-3.5-flash-lite, second_opinion: qwen3.8-max, temperature: 0.2, json: true, timeout_s: 10 }
care_capability:     { model: gemma-4-31B-it,  thinking: minimal, fallback: gemini-3.5-flash-lite, second_opinion: qwen3.8-max, temperature: 0.0, json: true, timeout_s: 12 }
care_extract:        { model: gemma-4-31B-it,  thinking: minimal, fallback: gemini-3.5-flash-lite, second_opinion: qwen3.8-max, temperature: 0.0, json: true, timeout_s: 15 }

# Speech: Sarvam, turn-based only
stt:
  provider: sarvam
  model: "saaras:v4"
  # codemix keeps English words in Latin and Hindi words in Devanagari, which is what
  # language_style.py needs to tell hi from hinglish.
  mode: codemix
  keyterms: true
  timeout_s: 4
tts:
  provider: sarvam
  model: "bulbul:v4-flash"
  # The voice of the Bolna hospital-call agent (scripts/bolna_agent.py), which users preferred: Aparna (Customer),
  # Hindi, for every reply style, so the app sounds like the calls; pace 1.1 (a little faster) at the user's request.
  pace: 1.1
  sample_rate: 24000
  # Measured 2026-10-31: Bulbul v4-flash answers in ~0.7-1.3 s once the client is warm; long digests take longer.
  timeout_s: 4
  max_timeout_s: 12
  speakers:   { en: aparna_hi_customer, hi: aparna_hi_customer, hinglish: aparna_hi_customer }
  languages:  { en: hi-IN, hi: hi-IN, hinglish: hi-IN }
  # Hinglish is converted to Devanagari before speaking (the caption stays Roman): read from Roman letters, Bulbul said
  # "niche" (neeche, below) as the English word. Costs ~0.7-0.9 s per new line.
  transliterate_hinglish: true
transliterate: { provider: sarvam }
# Gemini speech: used when Sarvam is unset or fails (app/speech/gemini_speech.py). Sarvam stays first because it is
# 2-3x faster for turn-based replies (measured 2026-10-31); conversations use voice_live.
gemini_tts: { model: gemini-3.8-flash-lite-tts, voice: Aoede, timeout_s: 8 }
gemini_stt: { model: gemini-3.5-transcribe, timeout_s: 6 }

# Prices for usage reports (app/usage.py, scripts/simulate_profiles.py), USD per million tokens. Left empty on purpose:
# copy them from your Google AI Studio / Cloud billing page. Unpriced models are reported by tokens, never guessed.
pricing:
  gemini-3.5-flash-lite:   { input_per_m: null, output_per_m: null }
  gemini-3.5-flash:        { input_per_m: null, output_per_m: null }
  gemini-3.1-pro-preview:  { input_per_m: null, output_per_m: null }
  gemini-4-argon:          { input_per_m: null, output_per_m: null }
