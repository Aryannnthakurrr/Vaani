<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* Inside the app's scrolling screen the page reports a height of 0, so "100%" alone draws nothing: the box gets a
     minimum height of its own (EmergencyScreen.kt sets the real one with setHeight()). */
  html, body, #map { margin: 0; height: 100%; min-height: 320px; background: #eef0eb; }
  .leaflet-control-attribution { font-size: 9px; }
  .fail { display: flex; height: 100%; align-items: center; justify-content: center; font: 18px sans-serif; color: #555; }
  .you { width: 22px; height: 22px; border-radius: 50%; background: #1a73e8; border: 4px solid #fff;
         box-shadow: 0 0 0 8px rgba(26,115,232,.18), 0 2px 6px rgba(0,0,0,.35); box-sizing: border-box; }
  .amb { width: 54px; height: 54px; border-radius: 16px; background: #c62828; border: 3px solid #fff;
         box-shadow: 0 3px 10px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  .label { font: 600 14px/1.1 Roboto, sans-serif; color: #222; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
           white-space: nowrap; text-align: center; }
</style>
</head>
<body>
<div id="map"></div>
<script>
// Called from EmergencyScreen.kt: setHeight(), init(), setRoute(), move(). Movement is eased over each 1 s update.
window.onerror = (msg, src, line) => console.error("map script error: " + msg + " @" + line);
if (!window.L) {
  document.getElementById("map").outerHTML = '<div class="fail">Map unavailable. The ambulance is still on its way.</div>';
  window.L = null;
}
const map = L && L.map("map", {zoomControl: false, attributionControl: true}).setView([20.6, 78.9], 5);
if (map) {
  // Esri's street map needs no API key (CARTO now does).
  const tiles = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    {maxZoom: 19, attribution: "Tiles © Esri"}).addTo(map);
  let tileErrors = 0;
  tiles.on("tileerror", (e) => { if (tileErrors++ < 3) console.error("tile failed: " + (e.tile && e.tile.src)); });
  if (window.ResizeObserver) new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById("map"));
}
const BAG = '<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M9 3h6a2 2 0 0 1 2 2v2h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V5a2 2 0 0 1 2-2zm0 4h6V5H9v2zm2 4v3H8v2h3v3h2v-3h3v-2h-3v-3h-2z"/></svg>';
let you = null, route = [], ahead = null, done = null, amb = null, current = null, anim = null, fitted = false;

function setHeight(px) {
  if (!map) return;
  document.documentElement.style.height = document.body.style.height = document.getElementById("map").style.height = px + "px";
  map.invalidateSize();
}

function labelled(html, label, size, anchorY) {
  return L.divIcon({className: "", iconSize: [120, size + 22], iconAnchor: [60, anchorY],
    html: '<div style="display:flex;flex-direction:column;align-items:center">' + html + '<div class="label">' + label + '</div></div>'});
}

function init(lat, lng, youLabel) {
  if (!map || you) return;
  map.invalidateSize();
  you = L.marker([lat, lng], {icon: labelled('<div class="you"></div>', youLabel || "You", 22, 11), zIndexOffset: 500}).addTo(map);
  map.setView([lat, lng], 15);
}

function setRoute(points) {
  if (!map) return;
  route = points;
  if (ahead) ahead.remove();
  if (done) done.remove();
  done = L.polyline([], {color: "#9e9e9e", weight: 6, opacity: .8}).addTo(map);
  ahead = L.polyline(route, {color: "#c62828", weight: 6}).addTo(map);
  // The top padding keeps markers clear of the "Simulation" banner the app draws over the map.
  if (!fitted && route.length) { map.fitBounds(ahead.getBounds(), {paddingTopLeft: [50, 110], paddingBottomRight: [50, 60]}); fitted = true; }
}

function nearestIndex(lat, lng) {
  let best = 0, bestD = Infinity;
  route.forEach((p, i) => { const d = (p[0] - lat) ** 2 + (p[1] - lng) ** 2; if (d < bestD) { bestD = d; best = i; } });
  return best;
}

function place(lat, lng, label) {
  if (!amb) amb = L.marker([lat, lng], {icon: labelled('<div class="amb">' + BAG + '</div>', label || "Ambulance", 54, 27), zIndexOffset: 1000}).addTo(map);
  amb.setLatLng([lat, lng]);
  if (route.length) {
    const i = nearestIndex(lat, lng);
    done.setLatLngs(route.slice(0, i + 1).concat([[lat, lng]]));
    ahead.setLatLngs([[lat, lng]].concat(route.slice(i + 1)));
  }
}

const ease = (k) => k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;

function move(lat, lng, heading, label) {
  if (!map) return;
  if (!current) { current = [lat, lng]; place(lat, lng, label); keepInView(); return; }
  const from = current.slice(), start = performance.now();
  if (anim) cancelAnimationFrame(anim);
  const step = (t) => {
    const k = ease(Math.min(1, (t - start) / 950));
    current = [from[0] + (lat - from[0]) * k, from[1] + (lng - from[1]) * k];
    place(current[0], current[1], label);
    if (k < 1) anim = requestAnimationFrame(step); else keepInView();
  };
  anim = requestAnimationFrame(step);
}

/** Keeps the ambulance and the patient on screen without jumping: only re-fits when one would leave the view. */
function keepInView() {
  if (!amb) return;
  const pts = [amb.getLatLng()].concat(you ? [you.getLatLng()] : []);
  const size = map.getSize();
  const inner = L.latLngBounds(map.containerPointToLatLng([50, 110]), map.containerPointToLatLng([size.x - 50, size.y - 60]));
  if (!pts.every((p) => inner.contains(p))) {
    map.flyToBounds(L.latLngBounds(pts), {paddingTopLeft: [60, 120], paddingBottomRight: [60, 70], duration: .8, maxZoom: 16});
  }
}
</script>
</body>
</html>
